name: Auto-resolve review threads (reusable)

# Reusable (workflow_call) version of NordScope's auto-resolve-review-threads.
# Call from a per-repo caller triggering on `pull_request_review_comment`.
#
# When the PR author (or a known autopilot/maintainer identity) replies on a
# review thread, mark the parent thread resolved — keeps the "unresolved
# threads" badge accurate without a manual click after every fix-and-reply.
#
# The allowed-replier set is: the PR author, `claude[bot]` (a wake-up session
# replying under the App identity), plus any logins passed in `extra_identities`
# (e.g. the org account that opens Claude PRs). Only resolves, never re-opens;
# no-op if already resolved or unmatched.

on:
  workflow_call:
    inputs:
      extra_identities:
        description: 'Comma-separated extra logins allowed to auto-resolve (beyond PR author + claude[bot]). e.g. "WEDDEsign".'
        type: string
        default: ''
    secrets:
      CEREMONY_PAT:
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  resolve:
    # A reply from someone outside the allowed set cannot resolve anything, and
    # every input that decides that is already in the event payload. Deciding it
    # here means no runner is allocated for those replies at all. The same
    # question asked one step later allocates a machine, reads three env vars,
    # skips, and still bills the whole minute GitHub rounds every job up to —
    # and on a busy PR most review replies come from reviewers, not the author
    # side, so that was the common path.
    #
    # DELIBERATELY MORE PERMISSIVE THAN THE STEP BELOW, which stays the exact
    # authority. GitHub's expression language has no `replace()`, so this cannot
    # trim whitespace around the entries of a comma-separated
    # `extra_identities`; an anchored `,login,` test would therefore reject
    # `'WEDDEsign, Foo'` — a spelling the input's own description permits and
    # the step accepts. A bare `contains` over the raw string can only ever
    # admit MORE logins than the step does, never fewer, so the failure
    # direction is a wasted minute rather than a thread left silently
    # unresolved. The step's exact-match loop then decides.
    #
    # Nothing here changes WHICH replies resolve a thread. That set has to stay
    # identical to the one `sweep-unresolved-threads` treats as author-side —
    # see the note in scripts/test-decision-logic.sh — and it does, because the
    # step that determines it is untouched.
    if: >-
      github.event.comment.in_reply_to_id != null && (
      github.event.comment.user.login == github.event.pull_request.user.login ||
      github.event.comment.user.login == 'claude[bot]' ||
      contains(inputs.extra_identities, github.event.comment.user.login) )
    runs-on: ubuntu-latest
    steps:
      - name: Check replier is allowed
        id: gate
        env:
          AUTHOR: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXTRA: ${{ inputs.extra_identities }}
        run: |
          set -eu
          allowed="${PR_AUTHOR},claude[bot]"
          if [ -n "${EXTRA}" ]; then
            allowed="${allowed},${EXTRA}"
          fi
          # Exact-match AUTHOR against the comma-separated allow-list.
          ok=$(printf '%s' "${allowed}" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -Fxq "${AUTHOR}" && echo yes || echo no)
          echo "author=${AUTHOR} allowed=${ok}"
          if [ "${ok}" = "yes" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve parent thread
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          owner=${REPO%/*}
          name=${REPO#*/}

          query_out=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 100) { nodes { databaseId } }
                    }
                  }
                }
              }
            }' \
            -F owner="$owner" -F name="$name" -F pr="$PR_NUMBER" 2>&1) || {
            echo "::warning::GraphQL query failed: $query_out"
            exit 0
          }

          thread_id=$(echo "$query_out" | jq -r "
            .data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved == false)
            | select(any(.comments.nodes[]; .databaseId == ${COMMENT_ID}))
            | .id" 2>/dev/null | head -n1 || true)

          if [ -z "$thread_id" ] || [ "$thread_id" = "null" ]; then
            echo "No matching unresolved thread for comment ${COMMENT_ID} on PR #${PR_NUMBER}; skipping."
            exit 0
          fi

          echo "Resolving thread ${thread_id} on PR #${PR_NUMBER}"
          gh api graphql \
            -f query='mutation($threadId: ID!) {
              resolveReviewThread(input: {threadId: $threadId}) {
                thread { id isResolved }
              }
            }' \
            -F threadId="$thread_id" || echo "::warning::resolveReviewThread failed for thread ${thread_id} — may already be resolved or token lacks permission."
