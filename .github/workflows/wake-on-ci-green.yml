name: Wake Claude on CI green (reusable)

# Reusable (workflow_call) version of NordScope's wake-claude-on-ci-green.
# Call it from a per-repo caller that triggers on `workflow_run` for that
# repo's CI workflows. See templates/caller-workflows/wake-on-ci-green.caller.yml.
#
# When all `required_checks` are green on a PR that is mid-loop (carries the
# `awaiting-codex-reping` label), post the bare `@codex review` re-ping
# DIRECTLY (as CEREMONY_PAT), then remove the label. The autopilot says "wait
# for green before re-pinging", but subscribe_pr_activity only routes into a
# running session and the fix-pushing session has usually ended.
#
# Why the workflow posts the trigger itself instead of waking a Claude session
# to do it: the re-ping must be the bare phrase `@codex review` with nothing
# appended. A session asked to "post @codex review" tends to append a status
# summary ("@codex review — addressed the P2 …"), and Codex's connector reads
# that trailing prose as a task — it flips into action mode and writes code /
# opens a follow-up PR instead of re-reviewing, so no review event fires and the
# loop stalls (Mentra PR #919). Posting the literal string from the workflow
# removes that failure mode entirely. Any soft-warn goes in a SEPARATE comment.
#
# `required_checks` is a JSON array of check-RUN names (job names as they appear
# as checks), so repos with spaces/parens in names (e.g. "Backend (pytest)")
# work unchanged.
#
# Hard-stop at round >= 25 escalates instead of waking, and does NOT remove
# `awaiting-codex-reping` (keeps loop state consistent for the human).

on:
  workflow_call:
    inputs:
      required_checks:
        description: 'JSON array of required check-run names that must all be success. e.g. ["Backend (pytest)","Frontend (tsc + build)"]'
        type: string
        required: true
      escalation_handle:
        type: string
        default: '@WEDDEsign'
    secrets:
      CEREMONY_PAT:
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: read
  checks: read

jobs:
  wake_claude:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          pr_number=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR for ${HEAD_SHA} — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check label and required-check status
        id: gate
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
        run: |
          set -eu
          has_label=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" \
            | jq -r '[.[][] | select(.name == "awaiting-codex-reping")] | length')
          if [ "${has_label}" = "0" ]; then
            echo "PR #${PR_NUMBER} not awaiting Codex re-ping — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_run fires once per CI workflow; the others may still be
          # running. Verify EVERY required check-run name is success for this
          # SHA before waking Claude. required_checks is a JSON array, so names
          # with spaces/parens are handled.
          # --paginate --slurp: check runs accumulate across every re-run, and
          # past 100 a required check on a later page is simply absent from
          # `have`, so `missing` stays non-empty and the re-ping never fires
          # despite green CI. Same defect the sweep carries; same fix.
          have=$(gh api --paginate --slurp \
            "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            | jq -c '[.[].check_runs[] | {name, conclusion}]')
          # For each required check NAME ($req), it is "missing" unless some
          # check-run with that name concluded success. Bind $req so the inner
          # `.name` comparison isn't shadowed by jq's `.` rebinding.
          missing=$(printf '%s' "$REQUIRED_CHECKS" | jq -r --argjson have "$have" '
            .[] as $req
            | select(($have | any(.name == $req and .conclusion == "success")) | not)
            | $req')
          if [ -n "${missing}" ]; then
            echo "Not all required checks green for ${HEAD_SHA}. Still pending/failed:"
            echo "${missing}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "All required checks green; waking Claude."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Read round counter
        id: round
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -eu
          n=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" \
            | jq -r '[.[][] | .name | capture("^codex-round-(?<n>[0-9]+)$") | .n | tonumber] | max // 0')
          echo "round=${n}" >> "$GITHUB_OUTPUT"
          if [ "${n}" -ge 25 ]; then
            echo "mode=hardstop" >> "$GITHUB_OUTPUT"
          elif [ "${n}" -ge 10 ]; then
            echo "mode=softwarn" >> "$GITHUB_OUTPUT"
          else
            echo "mode=normal" >> "$GITHUB_OUTPUT"
          fi

      - name: Hard-stop escalation
        if: steps.round.outputs.mode == 'hardstop'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ROUND: ${{ steps.round.outputs.round }}
          ESCALATION_HANDLE: ${{ inputs.escalation_handle }}
        run: |
          set -eu
          gh label create loop-stuck \
            --color B60205 \
            --description "Codex review autopilot exceeded round 25 — human intervention required" \
            2>/dev/null || true
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label loop-stuck
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${ESCALATION_HANDLE} — Codex review autopilot has reached **round ${ROUND}** on this PR with all required checks green. The hard-stop threshold (25) has been crossed; not posting the Codex review trigger.

          The \`loop-stuck\` label has been added. To resume the autopilot remove that label and re-trigger Codex manually, or close the loop."

      # Soft-warn (round >= 10) goes in its own comment addressed to the human —
      # NEVER appended to the trigger, or it would flip Codex into action mode.
      - name: Post soft-warn (separate comment)
        if: steps.gate.outputs.skip != 'true' && steps.round.outputs.mode == 'softwarn'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ROUND: ${{ steps.round.outputs.round }}
          ESCALATION_HANDLE: ${{ inputs.escalation_handle }}
        run: |
          set -eu
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${ESCALATION_HANDLE} — Codex review autopilot is at **round ${ROUND}** on this PR. Re-pinging Codex automatically (next comment). If this loop is oscillating (round N's findings ≈ round N-2's), consider stepping in. Hard-stop at round 25."

      # The label removal comes BEFORE the post, and is the claim rather than
      # the cleanup. `sweep-stalled-repings` runs on a schedule and can evaluate
      # the same PR at the same moment; it is a different workflow, so no
      # concurrency group can serialize the two, and a group shared with this
      # one would be actively harmful — GitHub cancels a previously *pending*
      # run when a new one queues, and CI completions arrive far too often for
      # that (NordScope#1198). Posting and then removing is not mutual
      # exclusion either: both paths can observe the label, and both post,
      # before either removal is visible.
      #
      # GitHub's label delete is atomic, so making it the claim gives exactly
      # one winner. A 404 means the sweep got there first and this run stands
      # down. `|| true` is deliberately NOT used — losing the claim must be
      # distinguishable from winning it.
      - name: Claim the gate (remove awaiting-codex-reping)
        id: claim
        if: steps.gate.outputs.skip != 'true' && steps.round.outputs.mode != 'hardstop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if gh api -X DELETE \
            "repos/${REPO}/issues/${PR_NUMBER}/labels/awaiting-codex-reping" \
            >/dev/null 2>&1; then
            # The PR can move after the green-check gate read but before this
            # atomic claim. Re-read after winning, and restore the gate instead
            # of posting against a head whose checks were never verified. Match
            # the scheduled sweep's handling of a head move or newly dirty /
            # still-unknown mergeability.
            after=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
              --jq '.head.sha + " " + .mergeable_state' || echo "")
            head_now="${after%% *}"
            state_now="${after##* }"
            if [ -z "${after}" ] || [ "${head_now}" != "${HEAD_SHA}" ] || \
               [ "${state_now}" = "dirty" ] || [ "${state_now}" = "unknown" ]; then
              if [ -z "${after}" ]; then
                why="the post-claim PR read failed"
              elif [ "${head_now}" != "${HEAD_SHA}" ]; then
                why="the head moved from ${HEAD_SHA} to ${head_now}"
              else
                why="mergeability became ${state_now}"
              fi
              if gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
                -f "labels[]=awaiting-codex-reping" >/dev/null 2>&1; then
                echo "${why} after the gate was claimed — restored the gate and standing down."
                echo "won=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::${why} after the gate was claimed, and the gate could not be restored. Re-apply awaiting-codex-reping by hand."
              exit 1
            fi
            echo "won=true" >> "$GITHUB_OUTPUT"
          else
            echo "The gate label was already gone — the scheduled sweep claimed it. Standing down."
            echo "won=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-ping Codex (bare trigger, posted directly)
        if: steps.claim.outputs.won == 'true'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          claim_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # MUST be exactly "@codex review" with nothing appended — trailing
          # prose flips Codex from review mode into action mode (see header).
          if ! gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "@codex review"; then
            # A nonzero exit does NOT prove the comment was not created: a lost
            # or timed-out response fails the client after GitHub committed the
            # write. Restoring the gate on top of a trigger that did land is
            # worse than leaving it off — the restored label would post-date the
            # trigger, so the sweep would read "gate awaiting the next push" and
            # wait forever, while another CI completion could claim it and post
            # a duplicate. Verify first; the trigger is assembled here rather
            # than written literally so this file keeps exactly one bare mention.
            handle="@""codex"
            # `|| true` below: the outage that made the post fail is exactly
            # what makes this read fail too, and `set -eu` would then exit
            # before either branch — losing the gate precisely when it matters.
            # An unknown answer resolves toward restoring, the recoverable side.
            landed=$(GH_TOKEN="${FALLBACK_TOKEN}" gh api --paginate --slurp \
              "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -r --arg t "${handle} review" --arg c "${claim_at}" '
                  [.[][] | select((.body | gsub("^\\s+|\\s+$"; "")) == $t)
                         | select(.created_at >= $c)] | length' || true)
            landed="${landed:-0}"
            # `>=`, not `>`: both timestamps carry only second precision, so a
            # comment created in the same second as the claim fails a strict
            # comparison and the gate is then restored on top of a trigger that
            # really landed — the exact corruption this check prevents.
            if [ "${landed}" -gt 0 ]; then
              echo "::warning::gh exited nonzero but the trigger is present; leaving the gate consumed."
              exit 0
            fi
            # The claim consumed the gate, so without this the PR has no label
            # AND no trigger — an unrecoverable stall. Put it back; the
            # scheduled sweep retries within one interval.
            # A failed restore must never be reported as a restore. The gate is
            # already claimed, so suppressing this leaves the PR with neither
            # trigger nor label — invisible to this path and to every sweep,
            # which selects on that label. Say which of the two happened.
            if GH_TOKEN="${FALLBACK_TOKEN}" gh api -X POST \
              "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=awaiting-codex-reping" >/dev/null 2>&1; then
              echo "::error::Failed to post the re-ping; gate restored for the sweep to retry."
            else
              echo "::error::#${PR_NUMBER} lost its gate: the re-ping failed AND the label could not be restored. No later sweep can find this PR — re-apply awaiting-codex-reping by hand."
            fi
            exit 1
          fi
