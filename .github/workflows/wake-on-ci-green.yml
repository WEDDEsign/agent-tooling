name: Wake Claude on CI green (reusable)

# Reusable (workflow_call) version of NordScope's wake-claude-on-ci-green.
# Call it from a per-repo caller that triggers on `workflow_run` for that
# repo's CI workflows. See templates/caller-workflows/wake-on-ci-green.caller.yml.
#
# When all `required_checks` are green on a PR that is mid-loop (carries the
# `awaiting-codex-reping` label), post the bare `@codex review` re-ping
# DIRECTLY (as CEREMONY_PAT), then remove the label. The autopilot says "wait
# for green before re-pinging", but subscribe_pr_activity only routes into a
# running session and the fix-pushing session has usually ended.
#
# Why the workflow posts the trigger itself instead of waking a Claude session
# to do it: the re-ping must be the bare phrase `@codex review` with nothing
# appended. A session asked to "post @codex review" tends to append a status
# summary ("@codex review — addressed the P2 …"), and Codex's connector reads
# that trailing prose as a task — it flips into action mode and writes code /
# opens a follow-up PR instead of re-reviewing, so no review event fires and the
# loop stalls (Mentra PR #919). Posting the literal string from the workflow
# removes that failure mode entirely. Any soft-warn goes in a SEPARATE comment.
#
# `required_checks` is a JSON array of check-RUN names (job names as they appear
# as checks), so repos with spaces/parens in names (e.g. "Backend (pytest)")
# work unchanged.
#
# Hard-stop at round >= 25 escalates instead of waking, and does NOT remove
# `awaiting-codex-reping` (keeps loop state consistent for the human).
#
# TWO ENTRY POINTS, because one is not enough.
#
# `workflow_run` alone made the loop order-dependent in a way that fails
# silently. The gate reads the label at the instant a CI workflow completes —
# roughly three minutes after a push on a small PR. A session that writes the
# label after that point loses: the evaluation has already run and skipped,
# and nothing will re-run it, because no further CI completion is coming. The
# loop looks like it simply stopped, and the only recovery is a human noticing
# and re-pinging by hand. Observed repeatedly across NordScope PRs.
#
# So the label being ADDED is now also an entry point. The caller adds
# `pull_request: types: [labeled]` and this workflow evaluates the same gate:
# if the required checks are already green, it re-pings immediately.
#
# The two cover every ordering between them. Label before CI finishes ->
# workflow_run path fires. Label after -> labeled path fires. Label while CI is
# still running -> labeled path skips on the check gate, then workflow_run
# fires when CI completes. Both paths converge on the same gate, so neither can
# re-ping a PR the other would have refused.

on:
  workflow_call:
    inputs:
      required_checks:
        description: 'JSON array of required check-run names that must all be success. e.g. ["Backend (pytest)","Frontend (tsc + build)"]'
        type: string
        required: true
      escalation_handle:
        type: string
        default: '@WEDDEsign'
    secrets:
      CEREMONY_PAT:
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: read
  checks: read

jobs:
  wake_claude:
    # A fork PR is excluded on the labeled path: it receives no CEREMONY_PAT,
    # so the re-ping step would fail rather than skip. The workflow_run path
    # was already immune -- it only fires for runs this repo owns.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
      ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'awaiting-codex-reping' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LABELED_PR: ${{ github.event.pull_request.number }}
          LABELED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # Label added after CI finished. The payload already carries both
            # values the workflow_run path has to look up. head.sha is the
            # branch head, not the synthetic merge commit, which is what
            # check-runs are reported against.
            echo "Label added on PR #${LABELED_PR} (${LABELED_SHA})."
            echo "pr_number=${LABELED_PR}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${LABELED_SHA}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number=$(gh api "repos/${REPO}/commits/${RUN_HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR for ${RUN_HEAD_SHA} — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${RUN_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check label and required-check status
        id: gate
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
        run: |
          set -eu
          has_label=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            --jq '[.[] | select(.name == "awaiting-codex-reping")] | length')
          if [ "${has_label}" = "0" ]; then
            echo "PR #${PR_NUMBER} not awaiting Codex re-ping — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verify EVERY required check-run name is success for this SHA.
          # Both entry points need this and for different reasons: workflow_run
          # fires once per CI workflow while the others may still be running,
          # and a label can be added at any time, including before CI has even
          # started. required_checks is a JSON array, so names with
          # spaces/parens are handled.
          have=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | {name, conclusion}]')
          # For each required check NAME ($req), it is "missing" unless some
          # check-run with that name concluded success. Bind $req so the inner
          # `.name` comparison isn't shadowed by jq's `.` rebinding.
          missing=$(printf '%s' "$REQUIRED_CHECKS" | jq -r --argjson have "$have" '
            .[] as $req
            | select(($have | any(.name == $req and .conclusion == "success")) | not)
            | $req')
          if [ -n "${missing}" ]; then
            echo "Not all required checks green for ${HEAD_SHA}. Still pending/failed:"
            echo "${missing}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "All required checks green; waking Claude."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Read round counter
        id: round
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -eu
          n=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            --jq '[.[] | .name | capture("^codex-round-(?<n>[0-9]+)$") | .n | tonumber] | max // 0')
          echo "round=${n}" >> "$GITHUB_OUTPUT"
          if [ "${n}" -ge 25 ]; then
            echo "mode=hardstop" >> "$GITHUB_OUTPUT"
          elif [ "${n}" -ge 10 ]; then
            echo "mode=softwarn" >> "$GITHUB_OUTPUT"
          else
            echo "mode=normal" >> "$GITHUB_OUTPUT"
          fi

      - name: Hard-stop escalation
        if: steps.round.outputs.mode == 'hardstop'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ROUND: ${{ steps.round.outputs.round }}
          ESCALATION_HANDLE: ${{ inputs.escalation_handle }}
        run: |
          set -eu
          gh label create loop-stuck \
            --color B60205 \
            --description "Codex review autopilot exceeded round 25 — human intervention required" \
            2>/dev/null || true
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label loop-stuck
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${ESCALATION_HANDLE} — Codex review autopilot has reached **round ${ROUND}** on this PR with all required checks green. The hard-stop threshold (25) has been crossed; not posting the Codex review trigger.

          The \`loop-stuck\` label has been added. To resume the autopilot remove that label and re-trigger Codex manually, or close the loop."

      # Soft-warn (round >= 10) goes in its own comment addressed to the human —
      # NEVER appended to the trigger, or it would flip Codex into action mode.
      - name: Post soft-warn (separate comment)
        if: steps.gate.outputs.skip != 'true' && steps.round.outputs.mode == 'softwarn'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ROUND: ${{ steps.round.outputs.round }}
          ESCALATION_HANDLE: ${{ inputs.escalation_handle }}
        run: |
          set -eu
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${ESCALATION_HANDLE} — Codex review autopilot is at **round ${ROUND}** on this PR. Re-pinging Codex automatically (next comment). If this loop is oscillating (round N's findings ≈ round N-2's), consider stepping in. Hard-stop at round 25."

      - name: Re-ping Codex (bare trigger, posted directly)
        if: steps.gate.outputs.skip != 'true' && steps.round.outputs.mode != 'hardstop'
        env:
          GH_TOKEN: ${{ secrets.CEREMONY_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -eu
          # MUST be exactly "@codex review" with nothing appended — trailing
          # prose flips Codex from review mode into action mode (see header).
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "@codex review"

      - name: Remove awaiting-codex-reping label
        if: steps.gate.outputs.skip != 'true' && steps.round.outputs.mode != 'hardstop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -eu
          gh api -X DELETE \
            "repos/${REPO}/issues/${PR_NUMBER}/labels/awaiting-codex-reping" \
            || true
